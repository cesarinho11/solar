<div class="app-container d-flex">
  <!-- Sidebar -->
  <app-sidenav (sidebarToggled)="onSidebarToggled($event)"></app-sidenav>

  <!-- Contenido principal -->
   
  <div
    class="main-content flex-grow-1 p-3 transition-all"
    [style.margin-left.px]="sidebarExpanded ? 25 : 70"
  >

  <div class="row mb-5">
  <div class="col-12 d-flex justify-content-end align-items-start gap-3">

    <!-- Botón Inbox -->
    <button (click)="verProductosFaltantes()" type="button" class="btn btn-warning position-relative  btn-sm" *ngIf="productos_faltantes>0">
      Stock faltante
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{productos_faltantes}}+
        
      </span>
    </button>

    <!-- Botón Salir -->
    <button 
    title="Cerrar Sesión"
      (click)="logout()"
      type="button"
      class="btn btn-outline-danger btn-sm">
      <i class="bi bi-box-arrow-left"></i>
    </button>

  </div>
</div>

    <!-- hola -->
    <router-outlet></router-outlet>
  </div>
</div>
