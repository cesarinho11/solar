<h1 mat-dialog-title style="border-bottom: 2px solid #eee;"  class="dialog-title">{{title}} nuevo <span class="close-btn " mat-dialog-close><img width="30px" src="../../../assets/x.png" alt=""></span> </h1>
<div mat-dialog-content>
  <form action="" [formGroup]="productoForm" >

    <div class="row">

      <div class="col-md-4 inputForm">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" formControlName="nombre" >
        <small class="text-danger" *ngIf="productoForm.get('nombre')?.invalid &&
                productoForm.get('nombre')?.touched">
         Nombre es obligatorio.
        </small>
      </div>
  
      <div class="col-md-4 inputForm">
        <label for="descripcion">Descripcion</label>
        <input type="text" class="form-control" id="descripcion" formControlName="descripcion" >
      </div>

      <div class="col-md-4 inputForm">
        <label for="desc_mini">Descripcion mini</label>
        <input type="text" class="form-control" id="desc_mini" formControlName="desc_mini" >
      </div>

      <div class="col-md-4 inputForm" >
        <label for="categoria">Categoria</label>
        
        <select class="form-select" aria-label="Default select example" id="categoria" formControlName="categoria" placeholder="categoria"  >
          <option *ngFor="let item of categoriaItems" [value]="item.id_categoria">{{item.nombre_categoria}}</option>
        </select>
        <small class="text-danger" *ngIf="productoForm.get('categoria')?.invalid &&
                productoForm.get('categoria')?.touched">
         Categoria es obligatorio.
        </small>
      </div>

      <div class="col-md-4 inputForm" >
        <label for="categoria2">Sub Categoria</label>
        <input type="text" class="form-control" id="categoria2" formControlName="categoria2" >
        <small class="text-danger" *ngIf="productoForm.get('categoria2')?.invalid &&
                productoForm.get('categoria2')?.touched">
          Sub categoria es obligatorio.
        </small>
      </div>

      <div class="col-md-4 inputForm" >
        <label for="Potencia">Potencia</label>
        <input type="text" class="form-control" id="potencia" formControlName="potencia" >
      </div>

      <div class="col-md-4 inputForm" >
        <label for="marca">Marca</label>
        <input type="text" class="form-control" id="marca" formControlName="marca" >
      </div>

      <div class="col-md-4 inputForm" >
        <label for="modelo">Modelo</label>
        <input type="text" class="form-control" id="modelo" formControlName="modelo" >
      </div>


        <input type="hidden" class="form-control" id="tipo" formControlName="tipo" >

      <div class="col-md-4 inputForm" >
        <label for="stock">Stock actual</label>
        <input type="number" class="form-control" id="stock" formControlName="stock" >
      </div>

      <div class="col-md-4 inputForm" >
        <label for="stock_min">Stock minimo</label>
        <input type="number" class="form-control" id="stock_min" formControlName="stock_min" >
      </div>

   
        <input type="hidden" class="form-control" id="stock_max" formControlName="stock_max" >
  
      <div class="col-md-4 inputForm" >
        <label for="costo">costo</label>
        <input type="text" class="form-control" id="costo" formControlName="costo" >
      </div>

      <div class="col-md-4 inputForm" >
        <label for="precio">precio</label>
        <input type="text" class="form-control" id="precio" formControlName="precio" >
      </div>

      <div class="col-md-4 inputForm" >
        <label for="ultima_compra">ultima compra</label>
        <input type="date" class="form-control" id="ultima_compra" formControlName="ultima_compra" >
      </div>

      <div class="col-md-4 inputForm" >
        <div class="form-check form-check-inline form-switch mt-3">
          <input class="form-check-input" type="checkbox" formControlName="alerta">
          <label class="form-check-label">Alerta stock</label>
        </div>
      </div>

    </div>

  </form>
</div>
<div mat-dialog-actions align="end" style="margin-top: 10px;">
  <!-- <button mat-button mat-dialog-close class="btn btnCancel ">Close</button> -->
  <button class="btn btnPrimary ml-5" type="button" *ngIf="data.accion=='nuevo'" (click)="onSubmit()"  >Guardar producto</button>
  <button class="btn btnPrimary ml-5" type="button" *ngIf="data.accion=='editar'" (click)="actualizarContrato()"  >Actualizar producto</button>
</div>
