  <div class="table-container">

  <!-- FILTRO -->
  <mat-form-field appearance="outline" class="w-100 mb-2">
    <mat-label>Buscar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filtrar tabla">
  </mat-form-field>

  <div class="table-scroll" *ngIf="scroll">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 w-100">

      <!-- COLUMNAS DINAMICAS -->
      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ col.label }}
        </th>

        <td mat-cell *matCellDef="let row"
            [ngClass]="{ 'row-verde': row.estatus == 3 }">
          {{ row[col.key] }}
        </td>
      </ng-container>

      <!-- ACCIONES -->
      <ng-container matColumnDef="acciones" *ngIf="actions.length > 0">
        <th mat-header-cell *matHeaderCellDef class="text-center">
          Acciones
        </th>

        <td mat-cell *matCellDef="let row"
            class="text-center"
            [ngClass]="{ 'row-verde': row.estatus == 3 }">

          <button
            *ngFor="let action of actions"
            mat-icon-button
            [hidden]="(action.type === 'confirm' || action.type === 'delete' || action.type === 'editar') && row.estatus == 3"
            [ngClass]="action.class || ''"
            (click)="onAction(action.type, row)"
            [title]="action.label">

            <i [class]="action.icon"></i>

          </button>

        </td>
      </ng-container>

      <!-- HEADER -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- ROW -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>

  <!-- PAGINADOR -->
  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5,10,20,50]"
    showFirstLastButtons>
  </mat-paginator>

</div>
